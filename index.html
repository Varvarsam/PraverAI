            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;

            margin-bottom: 0.8rem;

            margin-bottom: 1rem;

            border-radius: 8px;

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem;
            background: #f7fafc;
            border-radius: 8px;

        .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem; }

        .btn {

            padding: 1rem;
            background: var(--secondary-gradient);

        .back-to-top:hover {
            transform: translateY(-3px);

            right: 2rem;
            background: var(--primary-gradient);
            color: white !important;

            height: 60px;

            border-radius: var(--radius);

        .admin-form { background: #4a5568; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        .admin-form label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #cbd5e0; }
        .admin-form input, .admin-form select, .admin-form textarea {
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            border: 1px solid #718096;
            background: #2d3748;
            color: white;
            margin-bottom: 1rem;

        .admin-task-item {
            background: #4a5568;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .admin-task-info { flex: 1; font-size: 0.9rem; }

        .btn-admin { padding: 0.4rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; }
        .btn-edit { background: #ecc94b; color: #744210; }
        .btn-delete { background: #f56565; color: white; }
        .btn-export { background: #48bb78; color: white; margin-right: 0.5rem; }
        .btn-import { background: #4299e1; color: white; }

        .hidden { display: none !important; }

            background: #553c9a;
        }

        @media (max-width: 768px) {
            .toc-list { flex-direction: column; }

            .floating-toc { bottom: 1rem; right: 1rem; width: 50px; height: 50px; font-size: 1.2rem; }
        }
    </style>

        /* ===== 3. ФУНКЦЫІ КІРАВАННЯ ДАНЫМІ ===== */
        function getTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) return JSON.parse(stored);
            return DEFAULT_TASKS;
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function getNextId(tasks) {
            return tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
        }

        /* ===== 4. ПРАКРУТКА Ў САМЫ ВЕРХ ===== */
        function scrollToTop(event) {
            if (event) event.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ===== 5. ПРАКРУТКА ДА ПАНЭЛІ АДМІНІСТРАТАРА ===== */
        function scrollToAdminPanel() {
            const adminSection = document.getElementById('section-admin');
            if (adminSection) {
                const y = adminSection.getBoundingClientRect().top + window.pageYOffset - 100;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        /* ===== 6. РЭНДЭРЫНГ ІНТЭРФЕЙСУ ===== */
        function renderApp() {
            const tasks = getTasks();
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';

            const sections = {
                orthography: { title: "1. Арфаграфія", emoji: "🔤", intro: "Правільнае напісанне галосных і зычных." },
                morphology: { title: "2. Марфалогія", emoji: "🔡", intro: "Марфалагічныя прыметы і разбор часцін мовы." },
                syntax: { title: "3. Сінтаксіс і пунктуацыя", emoji: "📝", intro: "Будова сказа і знакі прыпынку." },
                lexics: { title: "4. Лексіка", emoji: "📖", intro: "Значэнне слоў, сінонімы, антонімы, паронімы." },
                phonetics: { title: "5. Фанетыка", emoji: "🔊", intro: "Гукі, транскрыпцыя, фанетычныя працэсы." },
                phraseology: { title: "6. Фразеалогія", emoji: "🎭", intro: "Устойлівыя выразы і іх ужыванне." },
                morphemics: { title: "7. Марфеміка", emoji: "🧩", intro: "Будова слова: корань, прыстаўка, суфікс, канчатак." },
                "word-formation": { title: "8. Словаўтварэнне", emoji: "🏗️", intro: "Спосабы ўтварэння новых слоў." },
                stylistics: { title: "9. Стылістыка і пераклад", emoji: "🎨", intro: "Стылі маўлення і правільны пераклад канструкцый." },
                mixed: { title: "10. Змешаны верыфікатар", emoji: "🎯", intro: "Кjмплексныя заданні на ўсе правілы." }
            };

            for (const [key, sec] of Object.entries(sections)) {
                const sectionTasks = tasks.filter(t => t.section === key);
                if (sectionTasks.length === 0) continue;

                const sectionEl = document.createElement('section');
                sectionEl.className = 'section';
                sectionEl.id = `section-${key}`;
                
                sectionEl.innerHTML = `
                    <div class="section-header">${sec.emoji} ${sec.title}</div>
                    <p class="section-intro">${sec.intro}</p>
                    <div id="tasks-${key}"></div>
                `;

                const tasksContainer = sectionEl.querySelector(`#tasks-${key}`);
                sectionTasks.forEach(task => {
                    tasksContainer.appendChild(createTaskCard(task));
                });

                const backLink = document.createElement('a');
                backLink.href = '#top';
                backLink.className = 'back-to-top';
                backLink.innerHTML = '⬆️ Вярнуцца ў змест';
                sectionEl.appendChild(backLink);

                mainContent.appendChild(sectionEl);
            }

            mainContent.appendChild(renderAdminPanel());
            
            // Аднаўляем стан адміністратара пасля перастройкі
            restoreAdminState();
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.dataset.id = task.id;

            const typeLabels = {
                'fill-gap': 'Запаўненне пропуску',
                'single-choice': 'Адзінкавы выбар',
                'true-false': 'Верна / Няверна',
                'matching': 'Суаднясенне',
                'classify': 'Класіфікуй памылку',
                'ordering': 'Парадкаванне',
                'find-fix': 'Знайдзі і выпраў'
            };

            let inputHtml = '';
            
            if (task.type === 'fill-gap' || task.type === 'find-fix') {
                inputHtml = `<input type="text" class="task-input" placeholder="Увядзіце правільны адказ..." data-type="text">`;
            } else if (task.type === 'single-choice' || task.type === 'classify' || task.type === 'true-false') {
                inputHtml = `<div class="options-group">`;
                const options = task.type === 'true-false' ? ['Верна', 'Няверна'] : task.options;
                options.forEach((opt) => {
                    inputHtml += `
                        <label class="option-label">
                            <input type="radio" name="task-${task.id}" value="${opt}">
                            <span>${opt}</span>
                        </label>
                    `;
                });
                inputHtml += `</div>`;
            } else if (task.type === 'matching') {
                inputHtml = `<div class="options-group">`;
                task.items.forEach((item, idx) => {
                    inputHtml += `
                        <div style="display:flex; gap:1rem; align-items:center; margin-bottom:0.5rem;">
                            <span style="flex:1; font-weight:600;">${item.left}</span>
                            <select class="task-input" style="margin:0; flex:1;" data-match-idx="${idx}">
                                <option value="">Выберыце адказ...</option>
                                ${task.items.map(i => `<option value="${i.right}">${i.right}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });
                inputHtml += `</div>`;
            } else if (task.type === 'ordering') {
                inputHtml = `<ul class="sortable-list" id="sort-${task.id}">`;
                const shuffled = [...task.items].sort(() => Math.random() - 0.5);
                shuffled.forEach((item) => {
                    inputHtml += `
                        <li class="sortable-item" data-text="${item.text}">
                            <span>${item.text}</span>
                            <div style="display:flex; gap:0.3rem;">
                                <button class="btn btn-up" onclick="moveItem(this, -1)">↑</button>
                                <button class="btn btn-down" onclick="moveItem(this, 1)">↓</button>
                            </div>
                        </li>
                    `;
                });
                inputHtml += `</ul>`;
            }

            card.innerHTML = `
                <div class="task-type-badge">${typeLabels[task.type] || task.type}</div>
                <div class="task-question">${task.question}</div>
                ${task.original ? `<div class="task-original">«${task.original}»</div>` : ''}
                ${inputHtml}
                <div class="btn-group">
                    <button class="btn btn-check" onclick="checkTask(${task.id})">✅ Праверыць</button>
                    <button class="btn btn-reset" onclick="resetTask(${task.id})">🔄 Скінуць</button>
                    <button class="btn btn-show" onclick="showAnswer(${task.id})">👁️ Паказаць адказ</button>
                </div>
                <div class="feedback" id="feedback-${task.id}"></div>
            `;

            return card;
        }

        /* ===== 7. ЛОГІКА ПРАВЕРКІ ===== */
        function checkTask(taskId) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const feedbackEl = document.getElementById(`feedback-${taskId}`);
            let isCorrect = false;

            if (task.type === 'fill-gap' || task.type === 'find-fix') {
                const input = document.querySelector(`#section-${task.section} .task-card[data-id="${taskId}"] .task-input`);
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswers = task.answer.toLowerCase().split('|').map(a => a.trim());
                isCorrect = correctAnswers.includes(userAnswer);
            } 
            else if (task.type === 'single-choice' || task.type === 'classify' || task.type === 'true-false') {
                const selected = document.querySelector(`input[name="task-${taskId}"]:checked`);
                if (selected) isCorrect = selected.value === task.answer;
            }
            else if (task.type === 'matching') {
                const selects = document.querySelectorAll(`#section-${task.section} .task-card[data-id="${taskId}"] select`);
                let allCorrect = true;
                selects.forEach((sel, idx) => {
                    if (sel.value !== task.items[idx].right) allCorrect = false;
                });
                isCorrect = allCorrect;
            }
            else if (task.type === 'ordering') {
                const list = document.getElementById(`sort-${taskId}`);
                const items = list.querySelectorAll('.sortable-item');
                const userOrder = Array.from(items).map(item => item.dataset.text).join(', ');
                isCorrect = userOrder === task.answer;
            }

            if (isCorrect) {
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerHTML = `<strong>✅ Правільна!</strong><br>${task.explanation}<br><span class="rule-link">📜 ${task.rule}</span>`;
            } else {
                feedbackEl.className = 'feedback incorrect';
                feedbackEl.innerHTML = `<strong>❌ Няправільна.</strong><br>Паспрабуйце яшчэ раз або націсніце "Паказаць адказ".`;
            }
        }

        function resetTask(taskId) {
            const card = document.querySelector(`.task-card[data-id="${taskId}"]`);
            if (!card) return;
            const inputs = card.querySelectorAll('input, select');
            inputs.forEach(input => {
                if (input.type === 'radio') input.checked = false;
                else input.value = '';
            });
            const feedbackEl = document.getElementById(`feedback-${taskId}`);
            feedbackEl.className = 'feedback';
            feedbackEl.innerHTML = '';
        }

        function showAnswer(taskId) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === taskId);
            const feedbackEl = document.getElementById(`feedback-${taskId}`);
            feedbackEl.className = 'feedback correct';
            feedbackEl.innerHTML = `<strong>💡 Правільны адказ:</strong> ${task.answer}<br><br>${task.explanation}<br><span class="rule-link">📜 ${task.rule}</span>`;
        }

        function moveItem(btn, direction) {
            const item = btn.closest('.sortable-item');
            const list = item.parentNode;
            if (direction === -1 && item.previousElementSibling) {
                list.insertBefore(item, item.previousElementSibling);
            } else if (direction === 1 && item.nextElementSibling) {
                list.insertBefore(item.nextElementSibling, item);
            }
        }

        /* ===== 8. ПАНЭЛЬ АДМІНІСТРАТАРА ===== */
        function renderAdminPanel() {
            const section = document.createElement('section');
            section.className = 'section';
            section.id = 'section-admin';
            section.innerHTML = `
                <div class="section-header">⚙️ Панэль адміністратара</div>
                <div class="admin-panel">
                    <div id="admin-login" class="admin-login ${adminState.isLoggedIn ? 'hidden' : ''}">
                        <p>Увядзіце пароль для доступу да кіравання заданнямі:</p>
                        <input type="password" id="admin-pass" placeholder="Пароль">
                        <button class="btn btn-check" id="admin-login-btn">🔐 Увайсці</button>
                        <p id="login-error" style="color:#f56565; margin-top:1rem; display:none;">Няправільны пароль!</p>

                    <div id="admin-interface" class="admin-interface" ${adminState.isLoggedIn ? 'style="display:block;"' : ''}>

                            <label>Раздзел</label>
                            <select id="new-section">
                                <option value="orthography">Арфаграфія</option>
                                <option value="morphology">Марфалогія</option>
                                <option value="syntax">Сінтаксіс і пунктуацыя</option>
                                <option value="lexics">Лексіка</option>
                                <option value="phonetics">Фанетыка</option>
                                <option value="phraseology">Фразеалогія</option>
                                <option value="morphemics">Марфеміка</option>
                                <option value="word-formation">Словаўтварэнне</option>
                                <option value="stylistics">Стылістыка і пераклад</option>
                                <option value="mixed">Змешаны</option>
                            </select>
                            
                            <label>Тып задання</label>
                            <select id="new-type">
                                <option value="fill-gap">Запаўненне пропуску</option>
                                <option value="single-choice">Адзінкавы выбар</option>
                                <option value="true-false">Верна / Няверна</option>
                                <option value="matching">Суаднясенне</option>
                                <option value="classify">Класіфікуй памылку</option>
                                <option value="ordering">Размяркуй па парадку</option>
                                <option value="find-fix">Знайдзі і выпраў</option>
                            </select>

                            <label>Зыходны тэкст з памылкай (калі ёсць)</label>
                            <input type="text" id="new-original" placeholder="Напрыклад: На сённяшні дзень...">

                            <label>Пытанне / Заданне</label>
                            <input type="text" id="new-question" placeholder="Што трэба зрабіць?">

                            <label>Правільны адказ</label>
                            <input type="text" id="new-answer" placeholder="Правільны варыянт">

                            <label>Тлумачэнне</label>
                            <textarea id="new-explanation" rows="3" placeholder="Чаму так?"></textarea>

                            <label>Спасылка на правіла</label>
                            <input type="text" id="new-rule" placeholder="Закон РБ № 420-З, § 15" value="Закон РБ № 420-З">

                            <label>Складанасць</label>
                            <div style="display:flex; gap:1rem; margin-bottom:1rem; color:white;">
                                <label><input type="radio" name="difficulty" value="Нізкая" checked> Нізкая</label>
                                <label><input type="radio" name="difficulty" value="Сярэдняя"> Сярэдняя</label>
                                <label><input type="radio" name="difficulty" value="Высокая"> Высокая</label>
                            </div>

                            <button class="btn btn-check" id="save-task-btn">💾 Захаваць заданне</button>
                            <button class="btn btn-reset" id="clear-form-btn" style="margin-left:0.5rem;">🔄 Ачысціць форму</button>
                        </div>

                        <div style="margin-bottom:1rem;">
                            <button class="btn btn-export" id="export-btn">📤 Экспартаваць у JSON</button>
                            <button class="btn btn-import" id="import-btn-trigger">📥 Імпартаваць з JSON</button>
                            <input type="file" id="import-file" class="hidden" accept=".json">
                            <button class="btn btn-delete" id="reset-default-btn" style="margin-left:1rem;">🗑️ Скід да стандартных</button>
                        </div>

                        <h3 style="margin-bottom:1rem;">Спіс заданняў</h3>
                        <div id="admin-task-list" class="admin-task-list"></div>

                        <button class="btn btn-reset" id="logout-btn" style="margin-top:2rem; width:100%;">🚪 Выйсці</button>

            return section;
        }

        /* ===== 9. АДНАЎЛЕННЕ СТАНУ АДМІНІСТРАТАРА ===== */
        function restoreAdminState() {
            if (!adminState.isLoggedIn) return;
            
            // Калі рэдагуецца заданне — запаўняем форму
            if (adminState.editingTaskId) {
                const tasks = getTasks();
                const task = tasks.find(t => t.id === adminState.editingTaskId);
                if (task) {
                    fillEditForm(task);
                    // Падсвятляем заданне ў спісе
                    highlightEditingTask(adminState.editingTaskId);
                }
            }
            
            // Прызначаем апрацоўшчыкі падзей для кнопак
            setupAdminEvents();
        }

        function fillEditForm(task) {
            document.getElementById('edit-task-id').value = task.id;
            document.getElementById('new-section').value = task.section;
            document.getElementById('new-type').value = task.type;
            document.getElementById('new-original').value = task.original || '';
            document.getElementById('new-question').value = task.question;
            document.getElementById('new-answer').value = task.answer;
            document.getElementById('new-explanation').value = task.explanation;
            document.getElementById('new-rule').value = task.rule;
            
            const diffRadios = document.getElementsByName('difficulty');
            for (let radio of diffRadios) {
                if (radio.value === task.difficulty) radio.checked = true;
            }
        }

        function highlightEditingTask(taskId) {
            const items = document.querySelectorAll('.admin-task-item');
            items.forEach(item => item.classList.remove('editing'));
            const target = document.querySelector(`.admin-task-item[data-task-id="${taskId}"]`);
            if (target) {
                target.classList.add('editing');
            }
        }

        /* ===== 10. АПРАЦОЎНІКІ ПАДЗЕЙ АДМІНІСТРАТАРА ===== */
        function setupAdminEvents() {
            const loginBtn = document.getElementById('admin-login-btn');
            if (loginBtn) {
                loginBtn.addEventListener('click', () => {
                    const pass = document.getElementById('admin-pass').value;
                    if (pass === ADMIN_PASSWORD) {
                        adminState.isLoggedIn = true;
                        document.getElementById('admin-login').classList.add('hidden');
                        document.getElementById('admin-interface').style.display = 'block';
                        renderAdminTaskList();
                    } else {
                        document.getElementById('login-error').style.display = 'block';
                    }
                });
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    adminState.isLoggedIn = false;
                    adminState.editingTaskId = null;
                    document.getElementById('admin-login').classList.remove('hidden');
                    document.getElementById('admin-interface').style.display = 'none';
                    document.getElementById('admin-pass').value = '';
                    document.getElementById('login-error').style.display = 'none';
                });
            }

            const saveBtn = document.getElementById('save-task-btn');
            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const tasks = getTasks();
                    const editId = document.getElementById('edit-task-id').value;
                    
                    const newTask = {
                        id: editId ? parseInt(editId) : getNextId(tasks),
                        section: document.getElementById('new-section').value,
                        type: document.getElementById('new-type').value,
                        original: document.getElementById('new-original').value,
                        question: document.getElementById('new-question').value,
                        answer: document.getElementById('new-answer').value,
                        explanation: document.getElementById('new-explanation').value,
                        rule: document.getElementById('new-rule').value,
                        difficulty: document.querySelector('input[name="difficulty"]:checked').value
                    };

                    if (editId) {
                        const idx = tasks.findIndex(t => t.id === parseInt(editId));
                        if (idx !== -1) {
                            if (tasks[idx].options) newTask.options = tasks[idx].options;
                            if (tasks[idx].items) newTask.items = tasks[idx].items;
                            tasks[idx] = newTask;
                        }
                    } else {
                        tasks.push(newTask);
                    }

                    saveTasks(tasks);
                    adminState.editingTaskId = null;
                    clearForm();
                    renderAdminTaskList();
                    renderApp();
                    // ЗАСТАЁМСЯ Ў ПАНЭЛІ АДМІНІСТРАТАРА
                    setTimeout(scrollToAdminPanel, 100);
                    alert('Заданне захавана!');
                });
            }

            const clearBtn = document.getElementById('clear-form-btn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    adminState.editingTaskId = null;
                    clearForm();
                    // Здымаем падсветку з усіх заданняў
                    document.querySelectorAll('.admin-task-item').forEach(item => item.classList.remove('editing'));
                });
            }

            const exportBtn = document.getElementById('export-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    const tasks = getTasks();
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "praver_shi_tasks.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                });
            }

            const importBtn = document.getElementById('import-btn-trigger');
            if (importBtn) {
                importBtn.addEventListener('click', () => {
                    document.getElementById('import-file').click();
                });
            }

            const importFile = document.getElementById('import-file');
            if (importFile) {
                importFile.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (Array.isArray(imported)) {
                                saveTasks(imported);
                                renderAdminTaskList();
                                renderApp();
                                setTimeout(scrollToAdminPanel, 100);
                                alert('Заданні паспяхова імпартаваны!');
                            } else {
                                alert('Няправільны фармат файла!');
                            }
                        } catch (err) {
                            alert('Памылка чытання файла!');
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = '';
                });
            }

            const resetBtn = document.getElementById('reset-default-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    if (confirm('Гэта выдаліць усе вашы змены і верне стандартныя заданні. Працягнуць?')) {
                        localStorage.removeItem(STORAGE_KEY);
                        adminState.editingTaskId = null;
                        renderAdminTaskList();
                        renderApp();
                        setTimeout(scrollToAdminPanel, 100);
                        alert('Скінута да стандартных налад!');
                    }
                });
            }
        }

        function renderAdminTaskList() {
            const tasks = getTasks();
            const list = document.getElementById('admin-task-list');
            if (!list) return;
            list.innerHTML = '';
            
            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'admin-task-item';
                item.dataset.taskId = task.id;
                // Калі гэта заданне зараз рэдагуецца — падсвятляем яго
                if (adminState.editingTaskId === task.id) {
                    item.classList.add('editing');
                }
                item.innerHTML = `
                    <div class="admin-task-info">
                        <strong>[${task.section}]</strong> ${task.question.substring(0, 60)}... 
                        <span style="color:#cbd5e0; font-size:0.8rem;">(${task.difficulty})</span>
                    </div>
                    <div class="admin-actions">
                        <button class="btn-admin btn-edit" data-id="${task.id}">✏️</button>
                        <button class="btn-admin btn-delete" data-id="${task.id}">🗑️</button>
                    </div>
                `;
                list.appendChild(item);
            });

            list.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => editTask(parseInt(btn.dataset.id)));
            });
            list.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteTask(parseInt(btn.dataset.id)));
            });
        }

        /* ===== 11. РЭДАГАВАННЕ ЗАДАННЯ (БЕЗ ПРАКРУТКІ ЎВЕРХ!) ===== */
        function editTask(id) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            // Захоўваем ID задання, якое рэдагуецца
            adminState.editingTaskId = id;
            
            // Запаўняем форму
            fillEditForm(task);
            
            // Падсвятляем заданне ў спісе
            highlightEditingTask(id);
            
            // Пракручваем да формы рэдагавання (у межах панэлі адміністратара)
            const adminForm = document.querySelector('.admin-form');
            if (adminForm) {
                const y = adminForm.getBoundingClientRect().top + window.pageYOffset - 100;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function deleteTask(id) {
            if (!confirm('Вы ўпэўнены, што хочаце выдаліць гэтае заданне?')) return;
            let tasks = getTasks();
            tasks = tasks.filter(t => t.id !== id);
            saveTasks(tasks);
            
            // Калі выдаляем заданне, якое рэдагавалася — ачышчаем форму
            if (adminState.editingTaskId === id) {
                adminState.editingTaskId = null;
                clearForm();
            }
            
            renderAdminTaskList();
            renderApp();
            // ЗАСТАЁМСЯ Ў ПАНЭЛІ АДМІНІСТРАТАРА
            setTimeout(scrollToAdminPanel, 100);
        }

        function clearForm() {
            const editIdField = document.getElementById('edit-task-id');
            if (editIdField) editIdField.value = '';
            const originalField = document.getElementById('new-original');
            if (originalField) originalField.value = '';
            const questionField = document.getElementById('new-question');
            if (questionField) questionField.value = '';
            const answerField = document.getElementById('new-answer');
            if (answerField) answerField.value = '';
            const explanationField = document.getElementById('new-explanation');
            if (explanationField) explanationField.value = '';
            const ruleField = document.getElementById('new-rule');
            if (ruleField) ruleField.value = 'Закон РБ № 420-З';
            const diffRadio = document.querySelector('input[name="difficulty"][value="Нізкая"]');
            if (diffRadio) diffRadio.checked = true;
        }

        /* ===== 12. ІНІЦЫЯЛІЗАЦЫЯ ===== */
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            setupAdminEvents();
        });
    </script>
</body>
</html>
